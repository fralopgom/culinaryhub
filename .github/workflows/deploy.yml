name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE:     ghcr.io/fralopgom/culinaryhub
  CONTAINER: culinaryhub
  ENV_FILE:  /share/CACHEDEV1_DATA/culinaryhub/app.env
  HOST_PORT: 3001
  CTR_PORT:  3000

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (native ARM64, layer cache)
        run: |
          docker build \
            --cache-from ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            .

      - name: Push to GHCR
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Write env file
        run: |
          mkdir -p "$(dirname ${{ env.ENV_FILE }})"
          cat > ${{ env.ENV_FILE }} <<'ENVEOF'
          DATABASE_URL=${{ secrets.CULINARYHUB_DATABASE_URL }}
          SYGNET_API_URL=${{ secrets.CULINARYHUB_SYGNET_API_URL }}
          SYGNET_SUITE_KEY=${{ secrets.CULINARYHUB_SYGNET_SUITE_KEY }}
          SESSION_SECRET=${{ secrets.CULINARYHUB_SESSION_SECRET }}
          ADMIN_ADDRESSES=${{ secrets.CULINARYHUB_ADMIN_ADDRESSES }}
          MIN_WALLET_TIER=${{ secrets.CULINARYHUB_MIN_WALLET_TIER }}
          DAILY_LIMIT_TIER1=${{ secrets.CULINARYHUB_DAILY_LIMIT_TIER1 }}
          DAILY_LIMIT_TIER2=${{ secrets.CULINARYHUB_DAILY_LIMIT_TIER2 }}
          DAILY_LIMIT_HIGH=${{ secrets.CULINARYHUB_DAILY_LIMIT_HIGH }}
          FLAG_HIDE_THRESHOLD=${{ secrets.CULINARYHUB_FLAG_HIDE_THRESHOLD }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID=${{ secrets.CULINARYHUB_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.CULINARYHUB_GITHUB_CLIENT_SECRET }}
          ENVEOF

      - name: Restart container
        run: |
          docker stop ${{ env.CONTAINER }} 2>/dev/null || true
          docker rm   ${{ env.CONTAINER }} 2>/dev/null || true
          docker run -d \
            --name ${{ env.CONTAINER }} \
            --restart unless-stopped \
            --env-file ${{ env.ENV_FILE }} \
            -p ${{ env.HOST_PORT }}:${{ env.CTR_PORT }} \
            ${{ env.IMAGE }}:latest

      - name: Health check
        run: |
          for i in $(seq 1 18); do
            STATUS=$(docker inspect --format='{{.State.Status}}' ${{ env.CONTAINER }} 2>&1)
            echo "Attempt $i/18 — container status: $STATUS"
            docker exec ${{ env.CONTAINER }} wget -qO /dev/null http://127.0.0.1:${{ env.CTR_PORT }} && exit 0
            sleep 5
          done
          echo "=== Container logs ==="
          docker logs ${{ env.CONTAINER }} --tail 30
          exit 1
